name: ipfs_io Update

on:
  schedule:
    # Se ejecuta cada hora
    - cron: '13 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

# Permisos necesarios para que el bot pueda escribir en el repo
permissions:
  contents: write
  pull-requests: write

# concurrency:
#   group: repo-main-writes
#   cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      # - name: Configurar Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.10'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run update script
        run: python script_ipfs_io.py

      - name: Verificar y Subir cambios
        uses: ./.github/actions/commit-and-push
        with:
          files: ipfs_io.m3u
          commit_message: "Update IPFS IO: ${{ github.run_id }}-${{ github.run_attempt }}"