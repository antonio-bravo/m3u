name: Actualizar Lista Skibid Deportes

on:
  schedule:
    - cron: '10,40 * * * *'  # Cada 30 minutos (minutos 10 y 40)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

      - name: Ejecutar script Skibid
        run: python script_skibid.py

      - name: Verificar y Subir cambios
        uses: ./.github/actions/commit-and-push
        with:
          files: lista_skibid.m3u
          commit_message: "Update Skibid Sports Playlists: ${{ github.run_id }}-${{ github.run_attempt }}"
