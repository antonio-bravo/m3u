name: Actualizar PlayTorrio Eventos Deportivos

on:
  # schedule:
  #    # Ejecutar cada hora
  #   - cron: '0 */2 * * *'
  workflow_dispatch:  # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

# concurrency:
#   group: repo-main-writes
#   cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pytz
      
      - name: Extract sports events
        run: |
          python playtorrio.py
          echo "✅ Eventos deportivos extraídos"
      
      - name: Commit and push changes
        uses: ./.github/actions/commit-and-push
        with:
          files: playtorrio.m3u playtorrio_events.json
          commit_message: Actualizar eventos deportivos PlayTorrio
