name: Build & Publish ZicoTV Token Extractor Docker Image

on:
  push:
    paths:
      - 'zicotv_token_extractor/**'
      - '.github/workflows/docker_zicotv_token_extractor.yml'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      keepLatestNoOfDockerImages:
        description: 'Número de versiones recientes a mantener en GHCR'
        required: false
        type: number
        default: 10

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      docker_image_name: 'm3u/zicotv-extractor'
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar QEMU (Soporte multi-arquitectura amd64/arm64)
        uses: docker/setup-qemu-action@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos (etiquetas)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/zicotv-extractor
          tags: |
            type=raw,value=latest
            type=sha

      - name: Compilar y Publicar imagen Docker / Podman
        uses: docker/build-push-action@v7
        with:
          context: ./zicotv_token_extractor
          file: ./zicotv_token_extractor/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old image versions in GHCR
        uses: actions/delete-package-versions@v5
        if: ${{ inputs.keepLatestNoOfDockerImages == null || inputs.keepLatestNoOfDockerImages > 0 }}
        with:
          package-name: ${{ env.docker_image_name }}
          package-type: 'container'
          min-versions-to-keep: ${{ inputs.keepLatestNoOfDockerImages || 10 }}
          prune-untagged: true
