name: Actualizar Lista SportsOnlineCi

on:
  schedule:
    - cron: "0 * * * *" # Ejecutar cada hora
  workflow_dispatch: # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python script_lista_sportsonlineci.py
        env:
          URL_PROG_TXT: https://sportsonline.cv/prog.txt

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local pull.rebase true
          git add lista_sportsonlineci.xml
          git diff --staged --quiet || git commit -m "Auto-update lista_sportsonlineci.xml - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
