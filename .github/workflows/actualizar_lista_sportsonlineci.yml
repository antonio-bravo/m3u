name: Actualizar Lista SportsOnlineCi

on:
  schedule:
    - cron: "23 * * * *" # Ejecutar cada hora (minuto 23)
  workflow_dispatch: # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-main-writes
  cancel-in-progress: false

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python script_lista_sportsonlineci.py
        env:
          URL_PROG_TXT: https://sportsonline.cv/prog.txt

      - name: Commit and push changes
        uses: ./.github/actions/commit-and-push
        with:
          files: lista_sportsonlineci.xml
          commit_message: Auto-update lista_sportsonlineci.xml
