name: Actualizar Canales Acestream

on:
  workflow_dispatch: # Permite ejecutar manualmente
  schedule:
    - cron: '0 * * * *' # Ejecuta cada hora

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-main-writes
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install requests
      run: pip install requests

    - name: Run script
      run: python script_canales_acestream.py

    - name: Commit and push changes
      uses: ./.github/actions/commit-and-push
      with:
        files: canales_acestream.m3u
        commit_message: Update canales_acestream.m3u
