name: Actualizar Lista DaddyLiveHD

on:
  schedule:
    - cron: '25 * * * *'  # Se ejecuta cada hora (minuto 25, libre de colisiones)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

      - name: Ejecutar script DaddyLiveHD
        run: python script_daddylive.py

      - name: Verificar y Subir cambios
        uses: ./.github/actions/commit-and-push
        with:
          files: lista_daddylive.m3u lista_daddylive_deportes.m3u lista_daddylive_ES.m3u
          commit_message: "Update DaddyLiveHD Playlists: ${{ github.run_id }}-${{ github.run_attempt }}"
