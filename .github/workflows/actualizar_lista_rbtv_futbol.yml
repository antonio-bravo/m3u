name: Actualizar Lista RBTV Futbol

on:
  schedule:
    - cron: '49 * * * *'  # Ejecutar cada hora (minuto 49)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-main-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests blackboxprotobuf

      - name: Run update script
        run: python script_lista_rbtv_futbol.py

      - name: Verificar y Subir cambios
        uses: ./.github/actions/commit-and-push
        with:
          files: lista_rbtv_futbol.m3u lista_rbtv_futbol.log
          commit_message: "Update RBTV Futbol: ${{ github.run_id }}-${{ github.run_attempt }}"
