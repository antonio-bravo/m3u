name: Arena4Viewer Update

on:
  schedule:
    # Se ejecuta cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

# Permisos necesarios para que el bot pueda escribir en el repo
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      # - name: Configurar Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.10'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run update script
        run: python script_arena4viewer.py

      - name: Verificar y Subir cambios
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git config --local pull.rebase true          
          
          # Añadimos el m3u y el log generado
          git add arena4viewer.m3u arena4viewer.log

          git diff --staged --quiet || git commit -m "Update Arena4Viewer: $(date +'%Y-%m-%d %H:%M:%S')"
          for i in {1..5}; do
            git pull --rebase origin main && git push origin main && break
            echo "Concurrencia detectada. Reintentando en 3 segundos..."
            sleep 3
          done
