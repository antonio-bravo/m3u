name: Actualizar Lista Agenda DEPORTE-LIBRE.FANS

on:
  schedule:
    - cron: '29 * * * *'  # Ejecutar cada hora (minuto 29)
  workflow_dispatch:  # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-main-writes
  cancel-in-progress: false

jobs:
  update-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run update script
        run: python script_agenda_DEPORTE-LIBRE.FANS.py

      - name: Commit and push changes
        uses: ./.github/actions/commit-and-push
        with:
          files: lista_agenda_DEPORTE-LIBRE.FANS.xml
          commit_message: Auto-update agenda
