name: Update logos_icastresana.xml

on:
  workflow_dispatch:  # Permite ejecutar el flujo de trabajo manualmente desde GitHub
  schedule:
    - cron: '57 * * * *'  # Ejecutar cada hora (minuto 57)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-main-writes
  cancel-in-progress: false

jobs:
  update_logos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script
      run: python script_logo_icastresana.py

    - name: Commit and push changes
      uses: ./.github/actions/commit-and-push
      with:
        files: logos_icastresana.xml
        commit_message: Update logos_icastresana.xml
