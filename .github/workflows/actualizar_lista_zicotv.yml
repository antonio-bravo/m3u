name: Actualizar Lista zicotv

on:
  schedule:
    - cron: '39 * * * *'  # Se ejecuta cada hora (minuto 39, libre de colisiones)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# concurrency:
#   group: repo-main-writes
#   cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Probar conectividad con ZicoTV
        run: |
          python -c "
          import sys
          print('Python version:', sys.version)
          try:
              from curl_cffi import requests as cureq
              s = cureq.Session(impersonate='safari17_0')
              r = s.get('https://bp.zicotv.cc/api/player/1', timeout=10)
              print('curl_cffi GET bp.zicotv.cc/api/player/1 ->', r.status_code, 'bytes:', len(r.text), 'preview:', repr(r.text[:120]))
          except Exception as e:
              print('curl_cffi GET bp.zicotv.cc ERROR:', type(e).__name__, e)

          try:
              from curl_cffi import requests as cureq
              s2 = cureq.Session(impersonate='safari17_0')
              r2 = s2.get('https://zicotv.cc/api/player/1', timeout=10)
              print('curl_cffi GET zicotv.cc/api/player/1 ->', r2.status_code, 'bytes:', len(r2.text), 'preview:', repr(r2.text[:120]))
          except Exception as e:
              print('curl_cffi GET zicotv.cc ERROR:', type(e).__name__, e)

          try:
              import requests
              r3 = requests.get('https://bp.zicotv.cc/api/player/1', headers={'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}, timeout=10)
              print('requests GET bp.zicotv.cc/api/player/1 ->', r3.status_code, 'bytes:', len(r3.text), 'preview:', repr(r3.text[:120]))
          except Exception as e:
              print('requests GET bp.zicotv.cc ERROR:', type(e).__name__, e)
          "
      - name: Run update script
        run: python script_zicotv.py

      - name: Verificar y Subir cambios
        uses: ./.github/actions/commit-and-push
        with:
          files: lista_zicotv.m3u
          commit_message: "Update zicotv: ${{ github.run_id }}-${{ github.run_attempt }}"
