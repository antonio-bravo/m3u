name: Actualizar Lista zicotv

on:
  schedule:
    - cron: '39 * * * *'  # Se ejecuta cada hora (minuto 39, libre de colisiones)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# concurrency:
#   group: repo-main-writes
#   cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run update script
        run: python script_zicotv.py

      - name: Verificar y Subir cambios
        uses: ./.github/actions/commit-and-push
        with:
          files: lista_zicotv.m3u
          commit_message: "Update zicotv: ${{ github.run_id }}-${{ github.run_attempt }}"
