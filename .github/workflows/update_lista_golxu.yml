name: Update lista_golxu

on:
  schedule:
    - cron: '26 * * * *'  # Ejecutar cada hora (minuto 26, sin colisiones)
  workflow_dispatch:  # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests

    - name: Run script to update Golxu files
      run: python script_golxu.py

    - name: Commit and push changes
      id: changes
      uses: ./.github/actions/commit-and-push
      with:
        files: lista_golxu.xml lista_golxu.m3u
        commit_message: Update lista_golxu outputs
