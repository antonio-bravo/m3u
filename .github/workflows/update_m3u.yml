name: Actualizar Lista M3U

on:
  schedule:
    - cron: "7 * * * *"  # Ejecuta el workflow cada hora (minuto 7)
  workflow_dispatch:      # Permite ejecutar manualmente

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-main-writes
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxml2-dev \
            libxslt-dev \
            libnspr4 \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-liberation

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores de Playwright
        run: |
          python -m playwright install chromium

      - name: Ejecutar script de scraping
        run: python script.py

      - name: Commit y push de cambios
        uses: ./.github/actions/commit-and-push
        with:
          files: lista.m3u
          commit_message: Actualizar lista M3U
