name: Actualizar Canales DEPORTE_LIBRE.FANS

on:
  schedule:
    - cron: '31 * * * *' # Ejecutar cada hora (minuto 31)
  workflow_dispatch: # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-main-writes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run scraping script
      run: python script_canales_DEPORTE-LIBRE.FANS.py

    - name: Commit and push updated XML
      uses: ./.github/actions/commit-and-push
      with:
        files: lista_canales_DEPORTE-LIBRE.FANS.xml
        commit_message: Update lista_canales_DEPORTE-LIBRE.FANS.xml
