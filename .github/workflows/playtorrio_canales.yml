name: PlayTorrio_Canales M3U Updater

on:
  schedule:
    - cron: '43 * * * *'  # Se ejecuta cada hora (minuto 43)
  workflow_dispatch:      # Botón para ejecutar manualmente

permissions:
  contents: write
  pull-requests: write

# concurrency:
#   group: repo-main-writes
#   cancel-in-progress: false

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    # Permisos explícitos para que el bot pueda escribir en el repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnspr4 \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run scraper script
        run: python playtorrio_canales.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: playtorrio-canales
          path: |
            playtorrio_canales.m3u
            channels_final.json

      - name: Commit and push changes
        uses: ./.github/actions/commit-and-push
        with:
          files: playtorrio_canales.m3u channels_final.json lista.m3u
          commit_message: Update playtorrio_canales.m3u