name: Build & Publish TVNow247 Proxy Docker Image

on:
  push:
    paths:
      - 'tvnow247_proxy/**'
      - '.github/workflows/docker_tvnow247_proxy.yml'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar QEMU (Soporte multi-arquitectura amd64/arm64)
        uses: docker/setup-qemu-action@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos (etiquetas)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/tvnow247-proxy
          tags: |
            type=raw,value=latest
            type=sha

      - name: Compilar y Publicar imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./tvnow247_proxy
          file: ./tvnow247_proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
