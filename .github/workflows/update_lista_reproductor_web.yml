name: Update lista_reproductor_web

on:
  schedule:
    - cron: '53 * * * *'  # Ejecutar cada hora (minuto 53)
  workflow_dispatch:  # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

# concurrency:
#   group: repo-main-writes
#   cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          wget \
          gnupg \
          libnss3 \
          libatk-bridge2.0-0 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libasound2t64 \
          libpango-1.0-0 \
          libcairo2 \
          fonts-liberation \
          libgtk-3-0 \
          libxss1

    - name: Install Google Chrome
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update -qq
        sudo apt-get install -y google-chrome-stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager beautifulsoup4 requests

    - name: Run your script to update the files
      run: python script_reproductor_web.py

    - name: Check for changes
      id: changes
      uses: ./.github/actions/commit-and-push
      with:
        files: lista_reproductor_web.xml lista_reproductor_web.m3u
        commit_message: Update lista_reproductor_web outputs
