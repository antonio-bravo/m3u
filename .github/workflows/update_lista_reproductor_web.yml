name: Update lista_reproductor_web

on:
  schedule:
    - cron: '53 * * * *'  # Ejecutar cada hora (minuto 53)
  workflow_dispatch:  # Permitir ejecución manual

permissions:
  contents: write
  pull-requests: write

# concurrency:
#   group: repo-main-writes
#   cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests

    - name: Run your script to update the files
      run: python script_reproductor_web.py

    - name: Check for changes
      id: changes
      uses: ./.github/actions/commit-and-push
      with:
        files: lista_reproductor_web.xml lista_reproductor_web.m3u
        commit_message: Update lista_reproductor_web outputs
